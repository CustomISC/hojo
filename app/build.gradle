plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.customisc.hojo"
        minSdkVersion 17
        targetSdkVersion 33
        versionCode 16
        versionName "1.3.0"

        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing is optional and env-var driven: unset locally (and on F-Droid's
    // build server, which applies its own signing) this simply yields an unsigned APK.
    signingConfigs {
        release {
            if (System.getenv("HOJO_KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("HOJO_KEYSTORE_PATH"))
                storePassword System.getenv("HOJO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HOJO_KEY_ALIAS") ?: "hojo-release"
                keyPassword System.getenv("HOJO_KEY_PASSWORD") ?: System.getenv("HOJO_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("HOJO_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    // Not published to Play Store; the dependency-transparency block this embeds in
    // the APK's signing block gets flagged as an unexpected extra block by F-Droid's scanner.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    namespace 'com.customisc.hojo'

    // libvlc-all bundles native libs for every ABI, which is most of this app's ~85MB
    // size. Split into one APK per ABI (plus a universal fallback) so most users only
    // download their own architecture's libs.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
}

// F-Droid requires a distinct versionCode per ABI-specific APK, encoded as
// 10 * <base versionCode> + <ABI digit>, with the digits ordered
// armeabi-v7a(1) < arm64-v8a(2) < x86(3) < x86_64(4) so that on a device compatible
// with more than one split (e.g. arm64 devices can also run armeabi-v7a builds),
// the higher-versionCode native build is preferred. The universal APK (no ABI
// filter, published on GitHub only -- not referenced by the F-Droid recipe) uses
// digit 0, keeping every distributed variant's versionCode monotonic per release.
def abiVersionCodeDigits = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def digit = abi != null ? abiVersionCodeDigits.get(abi, 0) : 0
        output.versionCodeOverride = variant.versionCode * 10 + digit
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'org.videolan.android:libvlc-all:3.6.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}